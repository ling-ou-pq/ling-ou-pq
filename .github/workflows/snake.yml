name: Generate contribution snake and stats

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch stats cards (best effort)
        run: |
          fetch() {
            for i in 1 2 3; do
              curl -fsSL "$1" -o "$2" && [ -s "$2" ] && grep -q "<svg" "$2" && return 0
              sleep 5
            done
            rm -f "$2"
            echo "::warning::failed to fetch $2 (skipped)"
          }
          mkdir -p dist
          fetch "https://github-readme-stats.vercel.app/api?username=ling-ou-pq&show_icons=true&count_private=true&theme=tokyonight&hide_border=true" dist/stats.svg
          fetch "https://streak-stats.demolab.com/?user=ling-ou-pq&theme=tokyonight&hide_border=true" dist/streak.svg
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=ling-ou-pq&layout=compact&theme=tokyonight&hide_border=true" dist/langs.svg

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ling-ou-pq
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
